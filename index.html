<style>
:root{color-scheme:dark;--o:#ff6a00;--bg:#0b0b0b;--card:#151515;--t:#fff;--m:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t);font-family:'Poppins',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(11,11,11,.85);backdrop-filter:blur(10px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:80px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px}
.logo i{width:40px;height:40px;border-radius:10px;background:var(--o);display:grid;place-items:center;font-style:normal;box-shadow:0 0 20px rgba(255,106,0,.5)}
.logo b{color:var(--o)}
.links{display:flex;align-items:center;gap:32px;font-size:14px;font-weight:500}
.links a.l{padding:6px 0;border-bottom:2px solid transparent}
.links a.l.on{color:var(--o);border-color:var(--o)}
.btn{background:var(--o);color:#fff;font-weight:600;font-size:12px;padding:13px 26px;border-radius:50px;box-shadow:0 0 25px rgba(255,106,0,.45);display:inline-block;letter-spacing:.3px}
.btn.o{background:transparent;box-shadow:none;border:1px solid #444}
.burger{display:none;background:none;border:0;color:#fff;font-size:26px}

.badge{display:inline-block;border:1px solid rgba(255,106,0,.4);background:rgba(255,106,0,.12);color:var(--o);font-size:11px;font-weight:600;letter-spacing:1px;padding:10px 20px;border-radius:50px;margin-bottom:24px}
h1{font-size:clamp(40px,7vw,72px);line-height:1.1;font-weight:800;max-width:640px;text-transform:uppercase}
h1 span,h2 span{color:var(--o)}
.hero p{color:#bbb;max-width:470px;margin:28px 0 36px;line-height:1.8;font-size:15px}
.hero .btns{display:flex;gap:16px;flex-wrap:wrap}
section.s{padding:90px 0;text-align:center}
.tag{color:var(--o);font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
h2{font-size:clamp(30px,5vw,44px);font-weight:700;margin:14px 0}
.sub{color:var(--m);max-width:520px;margin:0 auto 56px;line-height:1.7;font-size:15px}
.grid{display:grid;gap:24px;text-align:left}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.prog{border-radius:24px;height:400px;position:relative;overflow:hidden;background-color:#121212;background-repeat:no-repeat;background-position:top;background-size:100% auto;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover}
.prog>*{position:relative;z-index:1}.prog:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,#121212 52%)}.pill{align-self:flex-start;background:var(--o);font-size:11px;font-weight:700;letter-spacing:1px;padding:7px 16px;border-radius:50px;margin-bottom:14px;text-transform:uppercase}
.prog h3{font-size:22px;font-weight:700;margin-bottom:8px}
.prog p{color:#ccc;font-size:14px;line-height:1.6}
.prog a{color:var(--o);font-size:12px;font-weight:700;margin-top:14px;letter-spacing:.5px}
.feat{background:var(--card);border:1px solid #1f1f1f;border-radius:20px;padding:32px 24px;transition:.3s}
.feat:hover{border-left:3px solid var(--o);transform:translateY(-4px)}
.ic{width:58px;height:58px;border-radius:14px;background:#2a1a0f;border:1px solid #3a2414;display:grid;place-items:center;font-size:26px;margin-bottom:24px}
.feat h3{font-size:18px;margin-bottom:10px}
.feat p{color:var(--m);font-size:14px;line-height:1.7}
.q{color:#7a3b00;font-size:44px;line-height:1;font-weight:800}
.stars{color:var(--o);font-size:13px;letter-spacing:3px;margin:8px 0 18px}
.test p{font-style:italic;color:#ccc;line-height:1.8;font-size:15px;margin-bottom:26px}
.who{display:flex;align-items:center;gap:14px}
.av{background-size:cover;width:48px;height:48px;border-radius:50%;border:2px solid var(--o);background:#2a2a2a;display:grid;place-items:center;font-weight:700;font-size:15px}
.who b{display:block;font-size:15px}
.who small{color:var(--o);font-weight:600;font-size:13px}
.cf{max-width:640px;margin:0 auto;background:var(--card);border:1px solid #1f1f1f;border-radius:24px;padding:36px;text-align:left;display:grid;gap:18px}
.cf .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cf label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
.cf input,.cf textarea{width:100%;background:#0b0b0b;border:1px solid #2a2a2a;border-radius:12px;padding:14px 16px;color:#fff;font:inherit;font-size:14px;outline:none}
.cf input:focus,.cf textarea:focus{border-color:var(--o)}
.cf textarea{min-height:130px;resize:vertical}
.cf button{border:0;cursor:pointer;font-family:inherit;padding:15px;font-size:13px}
.ok{color:var(--o);font-weight:600;text-align:center;font-size:14px}
@media(max-width:640px){.cf .row{grid-template-columns:1fr}.cf{padding:24px}}
footer{background:#080808;border-top:1px solid #1a1a1a;padding:70px 0 0;color:var(--m);font-size:14px}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:40px;text-align:left}
.fg h4{color:#fff;font-size:16px;margin-bottom:20px}
.fg a,.fg li{display:block;margin-bottom:12px;list-style:none;line-height:1.6}
.fg a:hover{color:var(--o)}
.fg p{line-height:1.8;margin:18px 0;max-width:300px}
.soc{display:flex;gap:10px}
.soc a{width:38px;height:38px;border-radius:50%;background:#171717;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;margin:0}
.soc a:hover{background:var(--o);color:#fff}
.fb{border-top:1px solid #1a1a1a;margin-top:50px;padding:24px 0;text-align:center;font-size:13px}
@media(max-width:900px){.fg{grid-template-columns:1fr 1fr}}@media(max-width:640px){.fg{grid-template-columns:1fr}}
@media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g3,.g4{grid-template-columns:1fr}.burger{display:block}.links{display:none;position:absolute;top:80px;left:0;right:0;background:#0b0b0b;flex-direction:column;padding:24px;gap:20px}.links.open{display:flex}}
</style>

function Contact(){
  const [f,setF] = useState({name:"",email:"",phone:"",message:""});
  const [sent,setSent] = useState(false);
  const set = k => e => { setSent(false); setF({...f,[k]:e.target.value}); };
  const send = () => {
    if(!f.name.trim() || !/\S+@\S+\.\S+/.test(f.email) || !f.message.trim()){ setSent("err"); return; }
    setSent(true); setF({name:"",email:"",phone:"",message:""});
  };
  const fld = (k,l,t,ph) => h("div",null,h("label",null,l),h("input",{type:t,value:f[k],onChange:set(k),placeholder:ph}));
  return h("section",{className:"s",id:"contact"},h("div",{className:"wrap"},
    h("div",{className:"tag"},"Contact"),
    h("h2",null,"Get In ",h("span",null,"Touch")),
    h("p",{className:"sub"},"Have a question or ready to start? Send us a message and we'll get back to you."),
    h("div",{className:"cf"},
      h("div",{className:"row"},fld("name","Full Name","text","Your name"),fld("email","Email","email","you@email.com")),
      fld("phone","Phone","tel","Your phone number"),
      h("div",null,h("label",null,"Message"),h("textarea",{value:f.message,onChange:set("message"),placeholder:"How can we help you?"})),
      h("button",{className:"btn",onClick:send},"SEND MESSAGE →"),
      sent===true && h("div",{className:"ok"},"✓ Thank you! Your message has been sent."),
      sent==="err" && h("div",{className:"ok"},"Please fill in your name, a valid email, and a message."))));
}
